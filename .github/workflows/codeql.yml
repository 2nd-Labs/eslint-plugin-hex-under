name: 'Run CodeQL'
on:
  schedule:
    - cron: '30 2 * * *'
      timezone: 'Europe/Berlin'
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  codeql:
    runs-on: 'ubuntu-latest'
    permissions:
      security-events: 'write'
      packages: 'read'
      actions: 'read'
      contents: 'read'
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'javascript-typescript'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee' # v4
        with:
          languages: '${{ matrix.language }}'
          config-file: './.github/codeql/codeql-config.yml'
      - name: 'Autobuild'
        uses: 'github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee' # v4
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee' # v4
        with:
          category: '/language:${{ matrix.language }}'
